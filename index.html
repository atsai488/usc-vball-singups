<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <title>Sideout — Volleyball signup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <nav class="nav-tabs" aria-label="Main navigation">
        <button class="nav-tab active" data-view="signup">Weekly signup</button>
        <button class="nav-tab" data-view="roundrobin">Round robin</button>
        <button class="nav-tab" data-view="history">Match history</button>
        <button class="nav-tab" data-view="leaderboard">Leaderboard</button>
      </nav>
      <button class="admin-link" id="adminOpen">Admin board <span>→</span></button>
    </header>

    <main id="app"></main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=google-auth-3"></script>
  <script src="supabase-client.js?v=google-auth-3"></script>
  <script src="app.js?v=google-auth-3"></script>
</body>
</html>
